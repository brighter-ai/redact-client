[project]
name = "redact"
version = "11.0.0"
description = "Command-line and Python client for Brighter AI's Redact"
authors = [{name = "brighter AI", email = "dev@brighter.ai"}]
readme = "README.md"
license = "MIT"
requires-python = ">=3.9,<3.14"
dependencies = [
    "httpx>=0.23",
    "pydantic>=2,<3",
    "pydantic-settings>=2,<3",
    "tqdm>=4.60",
    "click==8.1.8",
    "typer>=0.6",
    "python-multipart>=0.0.5",
    "StrEnum>=0.4.9",
]

[project.scripts]
redact_file = "redact.main:redact_file_entry_point"
redact_folder = "redact.main:redact_folder_entry_point"

[dependency-groups]
dev = [
    "pytest>=7.1.2",
    "Pillow>=10.0",
    "uvicorn>=0.18.2",
    "fastapi>=0.115.6",
    "pytest-timeout>=2.1.0",
    "isort>=5.10.1",
    "black>=25.1.0,<26",
    "flake8>=5.0.4",
    "pytest-mock>=3.10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["redact"]
